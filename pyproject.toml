seaborn = "^0.13.2"
featuretools = "^1.31.0"
gymnasium = "^1.0.0"
scikit-fuzzy = "^0.5.0"
networkx = "^3.4.2"
spacy = "^3.7.5"
docx = "^0.2.4"
emoji = "^2.14.1"
num2words = "^0.5.14"
nltk = "^3.9.1"
python-docx = "^1.1.2"
opencv-python = "^4.11.0.86"
mahotas = "^1.4.18"
